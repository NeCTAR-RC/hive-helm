{{- if .Values.networkPolicy.enabled }}
# The API accepts traffic from anywhere in the cluster (the gateway pods live
# in their own namespace); Redis accepts only the hive pods, plus its
# metrics port for Prometheus when enabled.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hive.fullname" . }}-ingress
  labels:
    {{- include "hive.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hive.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
          protocol: TCP
{{- if .Values.components.redis }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hive.fullname" . }}-redis-ingress
  labels:
    {{- include "hive.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "hive.selectorLabels" . | nindent 14 }}
      ports:
        - port: 6379
          protocol: TCP
    {{- if .Values.redis.metrics.enabled }}
    - from:
        - namespaceSelector: {}
      ports:
        - port: 9121
          protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
