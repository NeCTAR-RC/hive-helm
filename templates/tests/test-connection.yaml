apiVersion: v1
kind: Pod
metadata:
  name: {{ include "hive.fullname" . }}-test-connection
  labels:
    {{- include "hive.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: registry.rc.nectar.org.au/docker.io/curlimages/curl:latest
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command:
        - sh
        - -c
        - >-
          curl -sf http://{{ include "hive.fullname" . }}:{{ .Values.service.port }}/readyz
          && curl -sf http://{{ include "hive.fullname" . }}:{{ .Values.service.port }}/api/config
